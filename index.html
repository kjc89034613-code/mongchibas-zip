<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽치바스</title>
<meta name="theme-color" content="#ff8a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몽치바스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7ef; --card:#ffffff; --ink:#3a2e28; --sub:#8a7b72; --line:#f0e2d4;
    --main:#ff8a3d; --main-soft:#ffe6d3;
    --c-dad:#3d7bff; --c-mom:#ff5c8a; --c-big:#8a5cff; --c-small:#22b07d;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px}
  .app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

  /* 상단 */
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .logo{font-family:'Jua',sans-serif;font-size:24px;color:var(--main);letter-spacing:.5px}
  .me-chip{display:flex;align-items:center;gap:6px;border:none;background:var(--card);
    padding:6px 12px 6px 6px;border-radius:999px;box-shadow:0 2px 8px rgba(120,70,30,.08);font-size:14px;color:var(--ink)}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;
    font-family:'Jua',sans-serif;font-size:14px;flex-shrink:0}

  main{flex:1;overflow:hidden;position:relative}
  .page{position:absolute;inset:0;display:none;flex-direction:column}
  .page.on{display:flex}

  /* 하단 탭 */
  nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  nav button{flex:1;border:none;background:none;padding:10px 0 8px;color:var(--sub);font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  nav button .ic{font-size:22px;filter:grayscale(1);opacity:.6}
  nav button.on{color:var(--main);font-weight:bold}
  nav button.on .ic{filter:none;opacity:1}
  .badge{position:absolute;top:4px;left:calc(50% + 6px);background:#ff3b30;color:#fff;font-size:11px;
    min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 5px}

  /* 채팅 */
  .chat-list{flex:1;overflow-y:auto;padding:8px 14px 12px}
  .day-sep{text-align:center;margin:14px 0 8px}
  .day-sep span{background:var(--main-soft);color:#b0602b;font-size:12px;padding:3px 10px;border-radius:999px}
  .msg{display:flex;gap:8px;margin:6px 0;align-items:flex-end}
  .msg .col{max-width:75%;display:flex;flex-direction:column}
  .msg .name{font-size:12px;color:var(--sub);margin:0 0 3px 4px}
  .bubble{background:var(--card);padding:9px 13px;border-radius:16px 16px 16px 4px;font-size:15px;line-height:1.45;
    white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(120,70,30,.07)}
  .time{font-size:11px;color:var(--sub);flex-shrink:0;margin-bottom:2px}
  .msg.mine{flex-direction:row-reverse}
  .msg.mine .bubble{color:#fff;border-radius:16px 16px 4px 16px}
  .msg.cont .avatar{visibility:hidden}
  .msg.cont .name{display:none}
  .empty{text-align:center;color:var(--sub);margin-top:30%;font-size:14px;line-height:1.7}
  .composer{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
  .composer textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;resize:none;
    max-height:110px;outline:none;background:#fffaf5;line-height:1.4}
  .send{width:42px;height:42px;border-radius:50%;border:none;background:var(--main);color:#fff;font-size:18px;flex-shrink:0;align-self:flex-end}
  .send:disabled{opacity:.4}

  /* 공통 */
  .scroll{flex:1;overflow-y:auto;padding:4px 14px 90px}
  .sec-title{font-family:'Jua',sans-serif;font-size:18px;margin:10px 2px}
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(120,70,30,.06);margin-bottom:10px}
  .fab{position:absolute;right:18px;bottom:18px;height:50px;padding:0 20px;border-radius:25px;border:none;
    background:var(--main);color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(255,138,61,.4);font-family:'Jua',sans-serif}
  .muted{color:var(--sub);font-size:13px}
  .icon-btn{border:none;background:none;color:var(--sub);font-size:13px;padding:4px 6px}

  /* 달력 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px}
  .cal-head b{font-family:'Jua',sans-serif;font-size:20px}
  .cal-head button{border:none;background:var(--card);width:36px;height:36px;border-radius:50%;font-size:16px;box-shadow:0 2px 6px rgba(120,70,30,.08)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal .dow{font-size:12px;color:var(--sub);padding:4px 0}
  .cal .dow:first-child,.cal .d.sun .n{color:#e5484d}
  .cal .dow:last-child,.cal .d.sat .n{color:#3d7bff}
  .cal .d{border:none;background:none;padding:6px 0 4px;border-radius:12px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .cal .d .n{font-size:14px;width:26px;height:26px;line-height:26px;border-radius:50%}
  .cal .d.other{opacity:.3}
  .cal .d.today .n{background:var(--main-soft);font-weight:bold}
  .cal .d.sel{background:var(--main-soft)}
  .cal .d.sel .n{background:var(--main);color:#fff!important}
  .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:36px}
  .dot{width:6px;height:6px;border-radius:50%}
  .ev{display:flex;gap:12px;align-items:flex-start}
  .ev .bar{width:4px;align-self:stretch;border-radius:2px}
  .ev .t{font-size:13px;color:var(--sub);min-width:70px}
  .ev .title{font-size:15px;font-weight:bold}
  .ev .memo{font-size:13px;color:var(--sub);margin-top:3px;white-space:pre-wrap}
  .who{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .who span{font-size:11px;color:#fff;padding:2px 7px;border-radius:999px}

  /* 공지 */
  .notice.pinned{border:2px solid var(--main)}
  .notice .pin{font-size:12px;color:var(--main);font-weight:bold}
  .notice h3{margin:4px 0 6px;font-size:16px}
  .notice p{margin:0;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .notice .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(40,25,15,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.on{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safe-b));
    max-height:90%;overflow-y:auto}
  .modal h2{font-family:'Jua',sans-serif;margin:0 0 14px;font-size:20px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;background:#fffaf5}
  .field input:focus,.field textarea:focus{border-color:var(--main)}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .pick{display:flex;gap:6px;flex-wrap:wrap}
  .pick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--sub)}
  .pick button.on{color:#fff}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns button{flex:1;height:46px;border-radius:12px;border:none;font-size:16px}
  .btn-main{background:var(--main);color:#fff;font-family:'Jua',sans-serif}
  .btn-sub{background:#f3ebe3;color:var(--ink)}
  .btn-del{background:#fff0f0;color:#e5484d;flex:0 0 80px!important}
  .check{display:flex;align-items:center;gap:8px;font-size:14px}

  /* 가족 선택 */
  .who-screen{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .who-screen.on{display:flex}
  .who-screen .logo{font-size:40px;margin-bottom:6px}
  .who-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:340px;margin-top:26px}
  .who-grid button{border:none;background:var(--card);border-radius:20px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
    box-shadow:0 4px 14px rgba(120,70,30,.08);font-size:15px;color:var(--ink)}
  .who-grid .avatar{width:56px;height:56px;font-size:22px}
  .who-grid small{color:var(--sub)}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(40,25,15,.85);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">몽치바스</div>
    <button class="me-chip" id="meChip"><span class="avatar" id="meAvatar"></span><span id="meName"></span></button>
  </header>

  <main>
    <!-- 채팅 -->
    <section class="page on" id="page-chat">
      <div class="chat-list" id="chatList"></div>
      <div class="composer">
        <textarea id="chatInput" rows="1" placeholder="메시지 입력"></textarea>
        <button class="send" id="sendBtn" disabled>➤</button>
      </div>
    </section>

    <!-- 일정 -->
    <section class="page" id="page-cal">
      <div class="scroll">
        <div class="cal-head">
          <button id="prevM">‹</button><b id="monthLabel"></b><button id="nextM">›</button>
        </div>
        <div class="card"><div class="cal" id="cal"></div></div>
        <div class="sec-title" id="dayLabel"></div>
        <div id="dayEvents"></div>
      </div>
      <button class="fab" id="addEvBtn">＋ 일정 추가</button>
    </section>

    <!-- 공지 -->
    <section class="page" id="page-notice">
      <div class="scroll" id="noticeList"></div>
      <button class="fab" id="addNtBtn">＋ 공지 쓰기</button>
    </section>
  </main>

  <nav>
    <button class="on" data-page="chat"><span class="ic">💬</span>채팅<span class="badge" id="chatBadge"></span></button>
    <button data-page="cal"><span class="ic">📅</span>일정</button>
    <button data-page="notice"><span class="ic">📢</span>공지<span class="badge" id="ntBadge"></span></button>
  </nav>
</div>

<!-- 가족 선택 화면 -->
<div class="who-screen" id="whoScreen">
  <div class="logo">몽치바스</div>
  <div class="muted">우리 가족 공간이에요. 누구세요?</div>
  <div class="who-grid" id="whoGrid"></div>
</div>

<!-- 일정 모달 -->
<div class="modal-bg" id="evModal">
  <div class="modal">
    <h2 id="evModalTitle">일정 추가</h2>
    <div class="field"><label>제목</label><input id="evTitle" maxlength="40" placeholder="예: 할머니 생신"></div>
    <div class="field"><label>날짜</label><input id="evDate" type="date"></div>
    <div class="row">
      <div class="field"><label>시작 시간 (선택)</label><input id="evStart" type="time"></div>
      <div class="field"><label>끝 시간 (선택)</label><input id="evEnd" type="time"></div>
    </div>
    <div class="field"><label>누구 일정?</label><div class="pick" id="evWho"></div></div>
    <div class="field"><label>메모 (선택)</label><textarea id="evMemo" rows="2" maxlength="300"></textarea></div>
    <div class="btns">
      <button class="btn-del" id="evDel">삭제</button>
      <button class="btn-sub" id="evCancel">취소</button>
      <button class="btn-main" id="evSave">저장</button>
    </div>
  </div>
</div>

<!-- 공지 모달 -->
<div class="modal-bg" id="ntModal">
  <div class="modal">
    <h2>공지 쓰기</h2>
    <div class="field"><label>제목</label><input id="ntTitle" maxlength="50"></div>
    <div class="field"><label>내용</label><textarea id="ntBody" rows="5" maxlength="1000"></textarea></div>
    <label class="check"><input type="checkbox" id="ntPin"> 📌 맨 위에 고정</label>
    <div class="btns">
      <button class="btn-sub" id="ntCancel">취소</button>
      <button class="btn-main" id="ntSave">올리기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot,
  query, orderBy, limit, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== Firebase 설정 (Mongchibas-zip 프로젝트) =====
const firebaseConfig = {
  apiKey: "AIzaSyDhFYYDUr_SkDcI9b67f73UJDZ_J3Zt3Lo",
  authDomain: "mongchibas-zip.firebaseapp.com",
  projectId: "mongchibas-zip",
  storageBucket: "mongchibas-zip.firebasestorage.app",
  messagingSenderId: "794707665187",
  appId: "1:794707665187:web:e947c9db146b41b0922c96"
};
const db = getFirestore(initializeApp(firebaseConfig));

// ===== 가족 구성원 =====
const MEMBERS = {
  dad:   { name: "구자천", role: "아빠",   short: "아빠", color: "var(--c-dad)" },
  mom:   { name: "강미화", role: "엄마",   short: "엄마", color: "var(--c-mom)" },
  big:   { name: "구정경", role: "큰딸",   short: "정경", color: "var(--c-big)" },
  small: { name: "구현경", role: "작은딸", short: "현경", color: "var(--c-small)" },
};
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate = ts => ts && ts.toDate ? ts.toDate() : new Date();
const hm = d => `${d.getHours() < 12 ? "오전" : "오후"} ${((d.getHours()+11)%12)+1}:${pad(d.getMinutes())}`;
const avatar = id => { const m = MEMBERS[id]; return m ? `<span class="avatar" style="background:${m.color}">${m.name[1]}</span>` : ""; };
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1800); }

let me = store.get("mcb_me");

// ===== 가족 선택 =====
$("whoGrid").innerHTML = Object.entries(MEMBERS).map(([id,m]) =>
  `<button data-id="${id}">${avatar(id)}<b>${m.name}</b><small>${m.role}</small></button>`).join("");
$("whoGrid").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  me = b.dataset.id; store.set("mcb_me", me); $("whoScreen").classList.remove("on"); renderMe(); renderChat(); renderNotices(); updateBadges();
};
$("meChip").onclick = () => { if (confirm("다른 가족으로 바꿀까요?")) $("whoScreen").classList.add("on"); };
function renderMe(){ if(!me) return; $("meAvatar").outerHTML = `<span class="avatar" id="meAvatar" style="background:${MEMBERS[me].color}">${MEMBERS[me].name[1]}</span>`; $("meName").textContent = MEMBERS[me].role; }
if (!me || !MEMBERS[me]) $("whoScreen").classList.add("on"); else renderMe();

// ===== 탭 =====
let curPage = "chat";
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  curPage = b.dataset.page;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x===b));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "page-"+curPage));
  if (curPage === "chat") { markChatSeen(); scrollChat(); }
  if (curPage === "notice") markNoticeSeen();
});

// ===== 채팅 =====
let messages = [];
const chatInput = $("chatInput");
chatInput.oninput = () => {
  $("sendBtn").disabled = !chatInput.value.trim();
  chatInput.style.height = "auto"; chatInput.style.height = Math.min(chatInput.scrollHeight,110)+"px";
};
chatInput.onkeydown = e => { if (e.key==="Enter" && !e.shiftKey && !e.isComposing && window.innerWidth>700) { e.preventDefault(); sendMsg(); } };
$("sendBtn").onclick = sendMsg;
async function sendMsg(){
  const text = chatInput.value.trim(); if (!text || !me) return;
  chatInput.value = ""; chatInput.oninput();
  try { await addDoc(collection(db,"messages"), { author: me, text, createdAt: serverTimestamp() }); }
  catch(e){ toast("전송 실패: " + e.code); chatInput.value = text; chatInput.oninput(); }
}
function scrollChat(){ const l=$("chatList"); l.scrollTop = l.scrollHeight; }
function renderChat(){
  const l = $("chatList");
  const nearBottom = l.scrollHeight - l.scrollTop - l.clientHeight < 120;
  if (!messages.length) { l.innerHTML = `<div class="empty">아직 대화가 없어요 🙂<br>가족에게 첫 인사를 보내보세요!</div>`; return; }
  let html = "", lastDay = "", lastAuthor = "", lastTime = 0;
  for (const m of messages) {
    const d = m.date, day = ymd(d);
    if (day !== lastDay) { html += `<div class="day-sep"><span>${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일</span></div>`; lastAuthor=""; }
    const mine = m.author === me, mem = MEMBERS[m.author] || {short:"?",color:"#999",role:"?"};
    const cont = m.author === lastAuthor && d - lastTime < 5*60*1000;
    html += `<div class="msg ${mine?"mine":""} ${cont?"cont":""}" data-id="${m.id}" data-author="${m.author}">
      ${mine?"":avatar(m.author)}
      <div class="col">${mine?"":`<div class="name">${mem.role}</div>`}
        <div class="bubble" style="${mine?`background:${mem.color}`:""}">${esc(m.text)}</div></div>
      <div class="time">${hm(d)}</div></div>`;
    lastDay = day; lastAuthor = m.author; lastTime = d;
  }
  l.innerHTML = html;
  if (nearBottom || l.dataset.first !== "1") { scrollChat(); l.dataset.first = "1"; }
}
// 내 메시지 길게 누르기(또는 우클릭) → 삭제
let pressTimer;
$("chatList").addEventListener("pointerdown", e => {
  const m = e.target.closest(".msg.mine"); if (!m) return;
  pressTimer = setTimeout(() => askDeleteMsg(m.dataset.id), 600);
});
["pointerup","pointerleave","pointercancel"].forEach(ev => $("chatList").addEventListener(ev, () => clearTimeout(pressTimer)));
$("chatList").addEventListener("contextmenu", e => { const m=e.target.closest(".msg.mine"); if(m){ e.preventDefault(); askDeleteMsg(m.dataset.id);} });
async function askDeleteMsg(id){ if (confirm("이 메시지를 삭제할까요?")) { try{ await deleteDoc(doc(db,"messages",id)); }catch(e){ toast("삭제 실패"); } } }

onSnapshot(query(collection(db,"messages"), orderBy("createdAt","desc"), limit(150)), snap => {
  messages = snap.docs.map(d => { const x = d.data({serverTimestamps:"estimate"}); return { id:d.id, ...x, date: toDate(x.createdAt) }; }).reverse();
  renderChat();
  if (curPage === "chat" && document.visibilityState === "visible") markChatSeen(); else updateBadges();
}, err => { $("chatList").innerHTML = `<div class="empty">연결 오류 😢<br>${esc(err.code)}</div>`; });

// ===== 안 읽은 표시 =====
let notices = [];
function markChatSeen(){ store.set("mcb_seen_chat", Date.now()); updateBadges(); }
function markNoticeSeen(){ store.set("mcb_seen_nt", Date.now()); updateBadges(); }
function updateBadges(){
  const sc = +(store.get("mcb_seen_chat")||0), sn = +(store.get("mcb_seen_nt")||0);
  const c = messages.filter(m => m.author !== me && +m.date > sc).length;
  const n = notices.filter(m => m.author !== me && +m.date > sn).length;
  setBadge($("chatBadge"), c); setBadge($("ntBadge"), n);
  const total = c + n;
  try { if (navigator.setAppBadge) total ? navigator.setAppBadge(total) : navigator.clearAppBadge(); } catch(e){}
  document.title = total ? `(${total}) 몽치바스` : "몽치바스";
}
function setBadge(el,n){ el.textContent = n>99?"99+":n; el.style.display = n ? "grid" : "none"; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (curPage==="chat") markChatSeen(); if (curPage==="notice") markNoticeSeen();
});

// ===== 일정 =====
let viewY, viewM, selDay = ymd(new Date()), events = [], unsubEv = null, editingEv = null;
{ const t = new Date(); viewY = t.getFullYear(); viewM = t.getMonth(); }
function subscribeMonth(){
  if (unsubEv) unsubEv();
  const from = new Date(viewY, viewM, 1), to = new Date(viewY, viewM+1, 0);
  from.setDate(from.getDate()-from.getDay()); to.setDate(to.getDate()+(6-to.getDay()));
  unsubEv = onSnapshot(query(collection(db,"schedules"), where("date",">=",ymd(from)), where("date","<=",ymd(to)), orderBy("date")), snap => {
    events = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderCal();
  }, err => toast("일정 불러오기 실패: " + err.code));
}
function renderCal(){
  $("monthLabel").textContent = `${viewY}년 ${viewM+1}월`;
  const first = new Date(viewY, viewM, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = ymd(new Date());
  let html = "일월화수목금토".split("").map(d=>`<div class="dow">${d}</div>`).join("");
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const key = ymd(d);
    if (i>=35 && d.getMonth()!==viewM) break;
    const evs = events.filter(e=>e.date===key);
    const who = [...new Set(evs.flatMap(e => e.members?.length ? e.members : [e.author]))];
    html += `<button class="d ${d.getMonth()!==viewM?"other":""} ${d.getDay()===0?"sun":""} ${d.getDay()===6?"sat":""} ${key===today?"today":""} ${key===selDay?"sel":""}" data-key="${key}">
      <span class="n">${d.getDate()}</span><span class="dots">${who.map(w=>`<i class="dot" style="background:${MEMBERS[w]?.color||"#999"}"></i>`).join("")}</span></button>`;
  }
  $("cal").innerHTML = html;
  renderDay();
}
function renderDay(){
  const d = new Date(selDay+"T00:00");
  $("dayLabel").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
  const evs = events.filter(e=>e.date===selDay).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
  $("dayEvents").innerHTML = evs.length ? evs.map(e => {
    const who = e.members?.length ? e.members : [e.author];
    return `<div class="card ev" data-id="${e.id}">
      <div class="bar" style="background:${MEMBERS[who[0]]?.color||"#999"}"></div>
      <div class="t">${e.start ? e.start + (e.end?"<br>~ "+e.end:"") : "하루 종일"}</div>
      <div style="flex:1"><div class="title">${esc(e.title)}</div>
        ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:""}
        <div class="who">${who.map(w=>`<span style="background:${MEMBERS[w]?.color}">${MEMBERS[w]?.role||"?"}</span>`).join("")}</div>
      </div></div>`;
  }).join("") : `<div class="card muted" style="text-align:center">일정이 없어요</div>`;
}
$("cal").onclick = e => { const b=e.target.closest(".d"); if(!b) return; selDay=b.dataset.key;
  const d=new Date(selDay+"T00:00"); if (d.getMonth()!==viewM){ viewY=d.getFullYear(); viewM=d.getMonth(); subscribeMonth(); } else renderCal(); };
$("prevM").onclick = () => { viewM--; if(viewM<0){viewM=11;viewY--;} subscribeMonth(); renderCal(); };
$("nextM").onclick = () => { viewM++; if(viewM>11){viewM=0;viewY++;} subscribeMonth(); renderCal(); };

let evWho = [];
function renderWhoPick(){
  $("evWho").innerHTML = Object.entries(MEMBERS).map(([id,m]) =>
    `<button data-id="${id}" class="${evWho.includes(id)?"on":""}" style="${evWho.includes(id)?`background:${m.color};border-color:${m.color}`:""}">${m.role}</button>`).join("")
    + `<button data-id="all">모두</button>`;
}
$("evWho").onclick = e => { const b=e.target.closest("button"); if(!b) return;
  const id=b.dataset.id;
  if (id==="all") evWho = evWho.length===4 ? [] : Object.keys(MEMBERS);
  else evWho = evWho.includes(id) ? evWho.filter(x=>x!==id) : [...evWho,id];
  renderWhoPick(); };
function openEv(ev){
  editingEv = ev || null;
  $("evModalTitle").textContent = ev ? "일정 수정" : "일정 추가";
  $("evTitle").value = ev?.title || ""; $("evDate").value = ev?.date || selDay;
  $("evStart").value = ev?.start || ""; $("evEnd").value = ev?.end || ""; $("evMemo").value = ev?.memo || "";
  evWho = ev ? (ev.members?.length ? [...ev.members] : [ev.author]) : [me];
  $("evDel").style.display = ev ? "" : "none";
  renderWhoPick(); $("evModal").classList.add("on");
}
$("addEvBtn").onclick = () => openEv();
$("dayEvents").onclick = e => { const c=e.target.closest(".ev"); if(c) openEv(events.find(x=>x.id===c.dataset.id)); };
$("evCancel").onclick = () => $("evModal").classList.remove("on");
$("evSave").onclick = async () => {
  const data = { title:$("evTitle").value.trim(), date:$("evDate").value, start:$("evStart").value, end:$("evEnd").value,
    memo:$("evMemo").value.trim(), members: evWho.length ? evWho : [me] };
  if (!data.title) return toast("제목을 입력해 주세요");
  if (!data.date) return toast("날짜를 골라 주세요");
  try {
    if (editingEv) await updateDoc(doc(db,"schedules",editingEv.id), { ...data, updatedBy: me, updatedAt: serverTimestamp() });
    else await addDoc(collection(db,"schedules"), { ...data, author: me, createdAt: serverTimestamp() });
    $("evModal").classList.remove("on"); toast("저장했어요");
    selDay = data.date; const d=new Date(data.date+"T00:00");
    if (d.getFullYear()!==viewY || d.getMonth()!==viewM){ viewY=d.getFullYear(); viewM=d.getMonth(); subscribeMonth(); } else renderCal();
  } catch(e){ toast("저장 실패: " + e.code); }
};
$("evDel").onclick = async () => {
  if (!editingEv || !confirm("이 일정을 삭제할까요?")) return;
  try { await deleteDoc(doc(db,"schedules",editingEv.id)); $("evModal").classList.remove("on"); toast("삭제했어요"); }
  catch(e){ toast("삭제 실패"); }
};

// ===== 공지 =====
onSnapshot(query(collection(db,"notices"), orderBy("createdAt","desc"), limit(50)), snap => {
  notices = snap.docs.map(d => { const x=d.data({serverTimestamps:"estimate"}); return { id:d.id, ...x, date: toDate(x.createdAt) }; });
  renderNotices();
  if (curPage==="notice" && document.visibilityState==="visible") markNoticeSeen(); else updateBadges();
}, err => toast("공지 불러오기 실패: " + err.code));
function renderNotices(){
  const list = [...notices].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || b.date-a.date);
  $("noticeList").innerHTML = `<div class="sec-title">📢 가족 공지</div>` + (list.length ? list.map(n => `
    <div class="card notice ${n.pinned?"pinned":""}" data-id="${n.id}">
      ${n.pinned?`<div class="pin">📌 고정 공지</div>`:""}
      <h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>
      <div class="foot"><span class="muted">${MEMBERS[n.author]?.role||"?"} · ${n.date.getMonth()+1}/${n.date.getDate()} ${hm(n.date)}</span>
        <span>${`<button class="icon-btn" data-act="pin">${n.pinned?"고정해제":"고정"}</button>`}
        ${n.author===me?`<button class="icon-btn" data-act="del">삭제</button>`:""}</span></div>
    </div>`).join("") : `<div class="card muted" style="text-align:center">아직 공지가 없어요</div>`);
}
$("noticeList").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.closest(".notice").dataset.id, n = notices.find(x=>x.id===id);
  try {
    if (b.dataset.act==="del" && confirm("공지를 삭제할까요?")) await deleteDoc(doc(db,"notices",id));
    if (b.dataset.act==="pin") await updateDoc(doc(db,"notices",id), { pinned: !n.pinned });
  } catch(err){ toast("처리 실패"); }
};
$("addNtBtn").onclick = () => { $("ntTitle").value=""; $("ntBody").value=""; $("ntPin").checked=false; $("ntModal").classList.add("on"); };
$("ntCancel").onclick = () => $("ntModal").classList.remove("on");
$("ntSave").onclick = async () => {
  const title=$("ntTitle").value.trim(), body=$("ntBody").value.trim();
  if (!title) return toast("제목을 입력해 주세요");
  try { await addDoc(collection(db,"notices"), { title, body, pinned:$("ntPin").checked, author: me, createdAt: serverTimestamp() });
    $("ntModal").classList.remove("on"); toast("공지를 올렸어요"); }
  catch(e){ toast("저장 실패: " + e.code); }
};
document.querySelectorAll(".modal-bg").forEach(m => m.onclick = e => { if (e.target===m) m.classList.remove("on"); });

subscribeMonth(); renderCal();

// ===== PWA 서비스워커 =====
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
